<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Suporte - BKP Corporation</title>

    <script src="https://www.google.com/recaptcha/api.js" async defer></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #10131a;
            color: #f1f5f9;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 30px;
            text-align: center;
            background: #1b202b;
            border: 1px solid #303848;
            border-radius: 16px;
            box-shadow: 0 10px 35px #0005;
        }

        h1 {
            margin-top: 0;
            color: #60a5fa;
        }

        p {
            color: #cbd5e1;
            line-height: 1.6;
        }

        .captcha-area {
            display: flex;
            justify-content: center;
            margin: 25px 0;
        }

        #contato-suporte {
            display: none;
            margin-top: 25px;
            padding: 18px;
            background: #252e3d;
            border-radius: 10px;
        }

        .email-link {
            color: #60a5fa;
            font-weight: bold;
            overflow-wrap: anywhere;
            text-decoration: underline;
        }

        .email-link:hover {
            color: #93c5fd;
        }

        #mensagem {
            margin-top: 15px;
            color: #fca5a5;
        }

        footer {
            margin-top: 30px;
            color: #94a3b8;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>BKP Corporation</h1>

        <h2>Central de Suporte</h2>

        <p>
            Para visualizar nosso contato de suporte,
            conclua a verificação abaixo.
        </p>

        <div id="area-verificacao">
            <div class="captcha-area">
                <div
                    class="g-recaptcha"
                    data-sitekey="6LcJUewtAAAAABkq6K_ja7SACnMI2I3KYUlR72UN"
                    data-callback="captchaValidado"
                    data-expired-callback="captchaExpirado">
                </div>
            </div>
        </div>

        <p id="mensagem"></p>

        <div id="contato-suporte">
            <h3>Verificação concluída!</h3>

            <p>
                Precisa de ajuda? Entre em contato com
                o suporte da BKP Corporation pelo e-mail:
            </p>

            <p>
                📧
                <a
                    class="email-link"
                    id="email-link"
                    href="#">
                </a>
            </p>
        </div>

        <footer>
            &copy; 2026 BKP Corporation. Todos os direitos reservados.
        </footer>
    </main>

    <script>
        // COLOQUE SEU GMAIL AQUI:
        const EMAIL_SUPORTE = "bkpcorporationsupport@gmail.com";

        function captchaValidado(token) {
            if (!token) {
                return;
            }

            document.getElementById("area-verificacao").style.display = "none";
            document.getElementById("mensagem").textContent = "";
            document.getElementById("contato-suporte").style.display = "block";

            const link = document.getElementById("email-link");

            link.textContent = bkpcorporationsupport@gmail.com;
            link.href =
                "mailto:" + bkpcorporationsupport@gmail.com +
                "?subject=Suporte%20BKP%20Corporation";
        }

        function captchaExpirado() {
            document.getElementById("mensagem").textContent =
                "A verificação expirou. Faça a verificação novamente.";
        }
    </script>
</body>
</html>
